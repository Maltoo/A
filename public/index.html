<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1cekusn - Cek Username Roblox</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7fb;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 50px;
      color: #333;
    }

    .search-box {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input {
      padding: 10px;
      width: 220px;
      border: 2px solid #007bff;
      border-radius: 8px;
      outline: none;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #0056b3;
    }

    .avatar {
      margin-top: 30px;
      text-align: center;
    }

    .avatar img {
      border-radius: 12px;
      border: 3px solid #007bff;
    }

    .error {
      color: red;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>🔍 1cekusn</h1>
  <p>Memudahkan pemain mencari player Roblox</p>

  <div class="search-box">
    <input type="text" id="username" placeholder="Masukkan username Roblox...">
    <button id="searchBtn">🔍</button>
  </div>

  <div class="avatar" id="hasil"></div>
  <p class="error" id="error"></p>

  <!-- Panggil file JavaScript eksternal -->
  <script src="script.js"></script>

</body>
</html>
