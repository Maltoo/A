<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Username Checker</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 2em; background: #f5f5f5; }
    h1 { margin-bottom: 1em; }
    input, button { font-size: 1em; padding: .5em; margin-right: .5em; }
    #result { margin-top: 1em; font-weight: bold; }
    #avatarContainer { margin-top: 10px; }
    img.avatar { border-radius: 50%; width: 150px; height: 150px; }
  </style>
</head>
<body>
  <h1>Roblox Username Checker</h1>

  <form id="usernameForm">
    <input type="text" id="username" placeholder="Enter Roblox username" required />
    <button type="submit">Check</button>
  </form>

  <div id="result"></div>
  <div id="avatarContainer"></div>

  <script>
    const form = document.getElementById('usernameForm');
    const resultDiv = document.getElementById('result');
    const avatarContainer = document.getElementById('avatarContainer');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();

      if (!username) return;

      resultDiv.textContent = 'Checking...';
      avatarContainer.innerHTML = '';

      try {
        const res = await fetch('/api/check-roblox-username', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });

        const data = await res.json();

        if (res.ok && data.exists) {
          resultDiv.innerHTML = `Username "<b>${username}</b>" exists!<br>User ID: <b>${data.user.id}</b>`;
          avatarContainer.innerHTML = `<img class="avatar" src="https://www.roblox.com/headshot-thumbnail/image?userId=${data.user.id}&width=150&height=150&format=png" alt="Avatar">`;
        } else {
          resultDiv.textContent = `Username "${username}" does not exist.`;
        }

      } catch (err) {
        resultDiv.textContent = 'Error checking username. Please try again later.';
      }
    });
  </script>
</body>
</html>
