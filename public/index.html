<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GolRoblox - Cek Username Roblox</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f8fafc;
      margin: 0;
      padding: 40px;
    }
    h1 {
      color: #222;
    }
    input {
      padding: 10px;
      border: 2px solid #007bff;
      border-radius: 6px;
      width: 220px;
    }
    button {
      padding: 10px 15px;
      background-color: #007bff;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    img {
      margin-top: 20px;
      border-radius: 12px;
      border: 3px solid #007bff;
    }
    #error {
      color: red;
      margin-top: 20px;
    }
    #hasil {
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <h1>🔍 GolRoblox</h1>
  <p>Cari dan lihat avatar Roblox berdasarkan username.</p>

  <input type="text" id="username" placeholder="Masukkan username Roblox...">
  <button id="searchBtn">Cari</button>

  <div id="hasil"></div>
  <p id="error"></p>

  <script>
    document.getElementById("searchBtn").addEventListener("click", cekUsername);

    async function cekUsername() {
      const username = document.getElementById("username").value.trim();
      const hasil = document.getElementById("hasil");
      const error = document.getElementById("error");
      hasil.innerHTML = "";
      error.textContent = "";

      if (!username) {
        error.textContent = "⚠️ Masukkan username terlebih dahulu.";
        return;
      }

      try {
        const response = await fetch("/api/check-roblox-username", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username }),
        });

        const data = await response.json();

        if (response.ok && data.exists) {
          const user = data.user;
          const avatarUrl = `https://www.roblox.com/headshot-thumbnail/image?userId=${user.id}&width=420&height=420&format=png`;

          hasil.innerHTML = `
            <h3>${user.requestedUsername}</h3>
            <img src="${avatarUrl}" alt="Avatar Roblox ${user.requestedUsername}">
            <p><b>User ID:</b> ${user.id}</p>
          `;
        } else {
          error.textContent = data.message || "❌ Username tidak ditemukan.";
        }
      } catch (err) {
        console.error(err);
        error.textContent = "⚠️ Gagal memeriksa (cek koneksi internet).";
      }
    }
  </script>
</body>
</html>
