<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GolRoblox - Cek Username Roblox</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css" />

  <!-- Custom CSS -->
  <style>
    body {
      background: #f4f6fb;
      font-family: 'Inter', sans-serif;
    }
    .hero {
      background: linear-gradient(90deg, #fcd34d, #fbbf24);
      padding: 60px 0;
      text-align: center;
    }
    .hero h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #111;
    }
    .check-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
      padding: 20px;
      max-width: 450px;
      margin: 30px auto;
    }
    #avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #facc15;
      display: none;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-warning" href="#">GolRoblox</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="navMenu" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Beli Robux</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Cek Pesanan</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="container">
      <h1>🔍 Cek Username Roblox Kamu</h1>
      <p>Masukkan username untuk melihat avatar Roblox secara instan</p>
    </div>
  </section>

  <!-- Cek Username -->
  <div class="check-card">
    <label class="form-label fw-semibold">Masukkan Username Roblox:</label>
    <div class="input-group mb-3">
      <input id="username" type="text" class="form-control" placeholder="Contoh: Player123" />
      <button id="checkBtn" class="btn btn-warning text-white">🔍 Cek</button>
    </div>

    <div id="status" class="text-muted mb-3">Belum dicek</div>

    <div class="text-center">
      <img id="avatar" src="" alt="Avatar Roblox" class="mb-3" />
      <h5 id="userDisplay" class="fw-bold"></h5>
    </div>
  </div>

  <!-- JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="assets/js/bootstrap.bundle.min.js"></script>

  <script>
    const checkBtn = document.getElementById("checkBtn");
    const usernameInput = document.getElementById("username");
    const statusEl = document.getElementById("status");
    const avatarEl = document.getElementById("avatar");
    const displayEl = document.getElementById("userDisplay");

    checkBtn.addEventListener("click", async () => {
      const username = usernameInput.value.trim();
      if (!username) {
        statusEl.textContent = "⚠️ Masukkan username terlebih dahulu.";
        return;
      }

      statusEl.textContent = "🔎 Memeriksa username...";
      avatarEl.style.display = "none";
      displayEl.textContent = "";

      try {
        const res = await fetch("/api/check-roblox-username", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username }),
        });

        const data = await res.json();

        if (res.ok && data.exists) {
          statusEl.textContent = `✅ Username ditemukan: ${data.user.username}`;
          displayEl.textContent = data.user.username;
          avatarEl.src = data.user.avatar || "";
          avatarEl.style.display = "block";
        } else {
          statusEl.textContent = "❌ Username tidak ditemukan.";
        }
      } catch (err) {
        statusEl.textContent = "⚠️ Gagal memeriksa. Coba lagi nanti.";
      }
    });
  </script>
</body>
</html>
